<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThumbWar — Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Shrikhand&family=Archivo+Black&family=Inter:wght@400;500;700;800;900&family=Bebas+Neue&family=Anton&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-play">
    <header class="topbar">
      <div class="brand small">
        <a href="/" class="brand-link">
          <span class="brand-play"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M2 20h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zm19.83-7.12c.11-.25.17-.52.17-.8V11c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.46-.08-.66-.23-.45-.52-.86-.88-1.22L14 2 7.59 8.41C7.21 8.79 7 9.3 7 9.83v7.84C7 18.95 8.05 20 9.34 20h8.11c.7 0 1.36-.37 1.72-.97l2.66-6.15z"/></svg></span>
          <span class="brand-name">Thumb<span class="brand-accent">War</span></span>
        </a>
      </div>
      <div class="topbar-right">
        <span id="room-code-pill" class="pill">—</span>
        <span id="timer-pill" class="pill pill-timer" hidden>--</span>
      </div>
    </header>

    <main id="app"></main>

    <div id="toast" class="toast" hidden></div>

    <div id="text-modal" class="modal" hidden>
      <div class="modal-card">
        <h2>Add text to thumbnail</h2>
        <input id="text-modal-input" class="input-xl" maxlength="80" placeholder="YOUR THUMBNAIL TEXT" />
        <div class="modal-row">
          <label class="ctl">
            Size
            <input id="text-modal-size" type="range" min="20" max="160" value="64" />
          </label>
          <label class="ctl">
            Color
            <input id="text-modal-color" type="color" value="#ffd400" />
          </label>
          <label class="ctl">
            Font
            <select id="text-modal-font">
              <option value="Impact" selected>Impact</option>
              <option value="Arial Black">Arial Black</option>
              <option value="Comic Sans MS">Comic Sans</option>
              <option value="Georgia">Georgia</option>
              <option value="Courier New">Courier</option>
              <option value="Archivo Black">Archivo Black</option>
              <option value="Bebas Neue">Bebas Neue</option>
            </select>
          </label>
          <label class="ctl">
            Bold
            <button type="button" class="btn btn-sm" id="text-modal-bold">B</button>
          </label>
        </div>
        <div class="text-preview" id="text-modal-preview">YOUR THUMBNAIL TEXT</div>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="text-modal-cancel">Cancel</button>
          <button class="btn btn-primary" id="text-modal-confirm">Add Text</button>
        </div>
      </div>
    </div>

    <template id="tpl-lobby">
      <section class="lobby panel">
        <div class="lobby-hero">
          <h1>ThumbWar Lobby</h1>
          <div class="lobby-code-block">
            <span class="lobby-code-label">Room code</span>
            <code id="lobby-code" class="big-code">----</code>
            <div class="lobby-code-actions">
              <button class="btn btn-ghost btn-sm" id="copy-code">📋 Copy</button>
              <button class="btn btn-ghost btn-sm" id="open-display">📺 Display</button>
            </div>
          </div>
        </div>

        <h2 class="lobby-section-title">Players</h2>
        <div class="player-grid" id="lobby-players"></div>

        <div class="lobby-bottom">
          <div class="lobby-settings">
            <div class="settings-card" id="timer-settings">
              <h3 class="settings-title">Game Settings</h3>
              <div class="settings-grid">
                <label class="setting-ctl">
                  <span class="setting-label">✍️ Writing</span>
                  <select id="cfg-write">
                    <option value="30">30 sec</option>
                    <option value="45" selected>45 sec</option>
                    <option value="60">1 min</option>
                    <option value="90">1.5 min</option>
                  </select>
                </label>
                <label class="setting-ctl">
                  <span class="setting-label">🎨 Drawing (each thumbnail)</span>
                  <select id="cfg-draw">
                    <option value="180" selected>3 min</option>
                    <option value="240">4 min</option>
                    <option value="300">5 min</option>
                  </select>
                </label>
                <label class="setting-ctl">
                  <span class="setting-label">🗳️ Voting</span>
                  <select id="cfg-vote">
                    <option value="10">10 sec</option>
                    <option value="15" selected>15 sec</option>
                    <option value="25">25 sec</option>
                    <option value="40">40 sec</option>
                    <option value="60">1 min</option>
                  </select>
                </label>
                <label class="setting-ctl">
                  <span class="setting-label">📺 Browse</span>
                  <select id="cfg-browse">
                    <option value="20">20 sec</option>
                    <option value="30" selected>30 sec</option>
                    <option value="45">45 sec</option>
                    <option value="60">1 min</option>
                  </select>
                </label>
                <label class="setting-ctl">
                  <span class="setting-label">🔄 Rounds</span>
                  <select id="cfg-rounds">
                    <option value="1">1 round</option>
                    <option value="2">2 rounds</option>
                    <option value="3" selected>3 rounds</option>
                    <option value="4">4 rounds</option>
                    <option value="5">5 rounds</option>
                  </select>
                </label>
                <label class="setting-ctl">
                  <span class="setting-label">⚔️ Matchups</span>
                  <select id="cfg-matchup">
                    <option value="3" selected>3-way with 6+ players, else 1v1</option>
                    <option value="2">Always 1v1</option>
                  </select>
                </label>
              </div>
            </div>

            <div class="settings-card" id="hall-settings">
              <label class="spectator-toggle">
                <input type="checkbox" id="cfg-hall" checked /> Feature our best thumbnail in the Hall of Thumbs
              </label>
              <p class="muted tiny">Shows the winning drawing, its title and players' names on the public homepage.</p>
            </div>

            <div class="settings-card settings-summary" id="settings-summary" hidden></div>

            <div class="settings-card tv-card" id="tv-card">
              <h3 class="settings-title">📺 TV / screen share</h3>
              <p class="muted tiny">Show the game on a big screen — a laptop plugged into a TV, or a screen you're sharing on a call. Everyone still plays on their phones.</p>
              <div class="tv-card-actions">
                <button class="btn btn-primary btn-sm" id="tv-this-device">Turn this screen into the TV</button>
                <button class="btn btn-ghost btn-sm" id="tv-new-tab">Open TV screen in a new tab</button>
              </div>
              <p class="muted tiny" id="tv-card-note"></p>
            </div>

            <div class="settings-card settings-card-spectator">
              <label class="spectator-toggle">
                <input type="checkbox" id="spectator" /> Spectator mode <span class="muted small">(watch only)</span>
              </label>
            </div>
          </div>

          <div class="lobby-start">
            <button class="btn btn-primary btn-xl" id="start-btn">Start Game</button>
            <p class="muted small" id="host-hint"></p>
          </div>
        </div>
      </section>
    </template>

    <template id="tpl-writing">
      <section class="writing panel">
        <div class="step-pill">STEP 1 / 2 · WRITE <span class="round-tag"></span></div>
        <h1 class="phase-headline">WRITE A <span class="highlight-cyan">BANGER</span> TITLE</h1>
        <p class="phase-sub caveat">...the kind your nan would 100% click on.</p>

        <div class="write-grid">
          <div class="col">
            <h3>Your creator</h3>
            <input id="persona-input" class="input-xl" maxlength="60" placeholder="e.g. MrBeast, Your Mom, A Cult Leader (blank = random)" />
            <p class="caveat" style="color:var(--muted);font-size:16px">Or pick a suggestion:</p>
            <div id="persona-suggestions" class="chip-wrap"></div>
          </div>

          <div class="col">
            <h3>Your title</h3>
            <textarea id="title-input" class="input-xl" maxlength="120" placeholder="I Survived 30 Days Living Like a Toddler"></textarea>
            <p class="caveat" style="color:var(--muted);font-size:16px">Tip: replace the [X] / [Y] blanks with your own words.</p>

            <h3>Need inspiration?</h3>
            <p class="caveat" style="color:var(--muted);font-size:16px">Tap a format and the blanks become part of your title.</p>
            <div id="format-suggestions" class="format-wrap"></div>
          </div>
        </div>
        <div class="submitted-card" id="writing-done" hidden>
          <div class="submitted-check">✅</div>
          <h2>Title submitted!</h2>
          <p class="submitted-title" id="writing-done-title"></p>
          <p class="muted" id="writing-done-creator"></p>
          <p class="submitted-wait" id="writing-done-wait"></p>
          <button class="btn btn-ghost btn-sm" id="writing-edit">✏️ Edit my title</button>
        </div>
        <div class="writing-actions">
          <span id="writing-status" class="muted"></span>
          <span class="writing-buttons">
            <button class="btn btn-ghost" id="random-title">🎲 Random</button>
            <button class="btn btn-primary btn-lg" id="submit-title">Submit Title</button>
          </span>
        </div>
      </section>
    </template>

    <template id="tpl-drawing">
      <section class="drawing panel">
        <div class="step-pill">STEP 2 / 2 · DRAW <span class="round-tag"></span></div>
        <div class="drawing-banner">
          <div class="banner-yt">
            <div class="banner-avatar" id="banner-dot">YT</div>
            <div class="banner-yt-text">
              <span class="drawing-banner-label">🎨 Draw the thumbnail · <span id="banner-step">Drawing 1 of 1</span></span>
              <div class="drawing-banner-title" id="banner-title">...</div>
              <div class="banner-channel"><span id="banner-persona"></span><span class="banner-verified" aria-hidden="true">✔</span><span class="banner-views" id="banner-views"></span></div>
            </div>
          </div>
          <span class="task-pager">
            <button class="btn btn-ghost btn-sm" id="prev-task">◀</button>
            <span id="task-label" class="pill">1 / 1</span>
            <button class="btn btn-ghost btn-sm" id="next-task">▶</button>
          </span>
        </div>

        <div class="toolbar" id="toolbar">
          <div class="tool-group">
            <button data-tool="pen" class="tool active" title="Pen (P)">✏️</button>
            <button data-tool="eraser" class="tool" title="Eraser (E)">🧽</button>
            <button data-tool="fill" class="tool" title="Fill (F)"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M16.56 8.94 8.32.7a1 1 0 0 0-1.41 0l-1.4 1.41 2.12 2.12-4.95 4.95a1.5 1.5 0 0 0 0 2.12l5.66 5.66a1.5 1.5 0 0 0 2.12 0l5.1-5.1a1.5 1.5 0 0 0 0-2.12l-.99-.8ZM7.05 6.34l4.24 4.24H4.93l2.12-2.12v-2.12Zm12.95 6.16s-2 2.17-2 3.5a2 2 0 1 0 4 0c0-1.33-2-3.5-2-3.5Z"/></svg></button>
            <button data-tool="line" class="tool" title="Line (L)">／</button>
            <button data-tool="rect" class="tool" title="Rectangle (R)">▭</button>
            <button data-tool="circle" class="tool" title="Circle (C)">◯</button>
            <button data-tool="arrow" class="tool" title="Arrow (A)">➜</button>
            <button data-tool="text" class="tool" title="Text (T)">T</button>
          </div>

          <div class="tool-group stickers" id="stickers">
            <span class="tool-group-label">Stickers</span>
            <button class="sticker-btn" data-sticker="➡️" title="Arrow">➡️</button>
            <button class="sticker-btn" data-sticker="⭐" title="Star">⭐</button>
            <button class="sticker-btn" data-sticker="🔥" title="Fire">🔥</button>
            <button class="sticker-btn" data-sticker="💯" title="100">💯</button>
            <button class="sticker-btn" data-sticker="😱" title="Shock">😱</button>
            <button class="sticker-btn" data-sticker="❗" title="Exclaim">❗</button>
          </div>

          <div class="tool-group">
            <label class="ctl">
              Size <span class="size-preview" id="size-preview"></span>
              <input type="range" id="size" min="1" max="80" value="6" />
            </label>
            <label class="ctl">
              Text
              <input type="range" id="text-size" min="10" max="120" value="48" />
            </label>
            <label class="ctl">
              Opacity
              <input type="range" id="opacity" min="10" max="100" value="100" />
            </label>
          </div>

          <div class="tool-group">
            <div id="palette" class="palette"></div>
            <label class="custom-color-wrap" title="Custom color">
              <span class="custom-color-plus">+</span>
              <input type="color" id="custom-color" value="#000000" />
            </label>
          </div>

          <div class="tool-group">
            <button class="btn btn-ghost btn-sm" id="undo" title="Undo (Ctrl+Z)">Undo</button>
            <button class="btn btn-ghost btn-sm" id="redo" title="Redo (Ctrl+Y)">Redo</button>
            <button class="btn btn-ghost btn-sm" id="clear">Clear</button>
          </div>
        </div>

        <div class="canvas-shell">
          <canvas id="thumb" width="1280" height="720"></canvas>
          <div class="place-banner" id="place-banner" hidden>
            <span class="place-hint">Drag to move · drag ◢ or pinch to resize</span>
            <span class="place-actions">
              <button class="btn btn-ghost btn-sm" id="obj-smaller" title="Smaller">A−</button>
              <button class="btn btn-ghost btn-sm" id="obj-bigger" title="Bigger">A+</button>
              <button class="btn btn-ghost btn-sm" id="obj-edit">Edit</button>
              <button class="btn btn-ghost btn-sm" id="obj-delete">Delete</button>
              <button class="btn btn-primary btn-sm" id="place-confirm">Done</button>
            </span>
          </div>
        </div>

        <div class="yt-card">
          <div class="yt-card-thumb-meta">
            <div class="yt-channel-dot" id="drawing-dot">YT</div>
            <div class="yt-text">
              <div class="yt-title" id="drawing-title">…</div>
              <div class="yt-meta">
                <span class="yt-channel" id="drawing-persona"></span>
                <span class="yt-dot">•</span>
                <span class="yt-views">drawing now</span>
              </div>
            </div>
          </div>
        </div>

        <div class="drawing-footer">
          <span id="drawing-status" class="muted"></span>
          <button class="btn btn-primary btn-lg" id="submit-drawing">Submit Thumbnail</button>
        </div>
      </section>
    </template>

    <template id="tpl-voting">
      <section class="voting panel">
        <p class="muted" id="vote-progress"></p>
        <h1 id="vote-title-row"></h1>
        <p class="vote-question caveat">Which thumb gets your click?</p>
        <div id="thumb-choices" class="vs-arena"></div>
        <p id="vote-status" class="muted"></p>
      </section>
    </template>

    <template id="tpl-scoreboard">
      <section class="scoreboard-phase panel">
        <p class="sb-kicker" id="scoreboard-round-label">Round complete</p>
        <h1 id="scoreboard-title" class="shrikhand">Scores</h1>
        <p class="sb-round-winner" id="scoreboard-winner"></p>
        <p class="muted" id="scoreboard-sub"></p>
        <ol id="mid-scoreboard" class="scoreboard"></ol>
        <p class="muted small" id="scoreboard-next"></p>
      </section>
    </template>

    <template id="tpl-browse">
      <section class="browse panel">
        <h1 class="phase-headline">📺 THE BROWSE PAGE</h1>
        <p class="phase-sub caveat">Two votes to cast: the best thumbnail <em>and</em> the best title.</p>

        <nav class="browse-steps" aria-label="Your votes">
          <a href="#browse-thumb-section" class="browse-step" id="browse-step-thumb">
            <span class="browse-step-check" aria-hidden="true">1</span> Best Thumbnail
          </a>
          <a href="#browse-title-section" class="browse-step" id="browse-step-title">
            <span class="browse-step-check" aria-hidden="true">2</span> Best Title
          </a>
        </nav>

        <div class="browse-section" id="browse-thumb-section">
          <div class="browse-section-kicker">Vote 1 of 2</div>
          <h2 id="browse-thumb-header">🎨 Best Thumbnail</h2>
          <p class="phase-sub caveat">The winner of every matchup. Which would make you click? (Can't pick your own art)</p>
          <div id="browse-thumb-grid" class="browse-grid"></div>
          <p id="browse-thumb-status" class="muted"></p>
        </div>

        <div class="browse-section" id="browse-title-section">
          <div class="browse-section-kicker">Vote 2 of 2</div>
          <h2 id="browse-title-header">✍️ Best Title Idea</h2>
          <p class="phase-sub caveat">Which video title is the most clickable? (Can't pick your own title)</p>
          <div id="browse-title-grid" class="browse-grid"></div>
          <p id="browse-title-status" class="muted"></p>
        </div>
      </section>
    </template>

    <template id="tpl-results">
      <section class="results panel">
        <h1 id="champion-headline" class="phase-headline">🏆 THUMBWAR CHAMPION</h1>
        <div id="champion-card" class="champion-card"></div>
        <h2>Final Scores</h2>
        <ol id="scoreboard" class="scoreboard"></ol>
        <h2>Awards</h2>
        <div id="awards" class="awards-grid"></div>
        <h2>Every Matchup</h2>
        <div id="final-gallery" class="matchup-gallery"></div>
        <div class="results-footer">
          <button class="btn btn-primary" id="play-again">Play Again</button>
        </div>
      </section>
    </template>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/fx.js"></script>
    <script src="/js/canvas.js"></script>
    <script src="/js/play.js"></script>
  </body>
</html>
